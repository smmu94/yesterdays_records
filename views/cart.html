<div class="container py-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a href="#/home">Inicio</a></li>
            <li class="breadcrumb-item active" aria-current="page">Carrito</li>
        </ol>
    </nav>
    <h2 class="mb-4">Mi Carrito</h2>
    <div id="cart-loading" class="text-center py-5">
        <div class="spinner-border text-warning"></div>
    </div>
    <div id="cart-empty" class="d-none text-center py-5">
        <i class="bi bi-cart fs-1 text-secondary d-block mb-3"></i>
        <h3>Tu carrito está vacío</h3>
        <p class="text-secondary">Agrega productos desde el catálogo.</p>
        <a class="btn btn-warning mt-2" id="btn-go-catalog">Ver catálogo</a>
    </div>
    <div id="cart-content" class="d-none">
        <div class="cart-card">
            <div class="cart-table-wrap">
                <table class="table table-dark table-hover align-middle mb-0 cart-table">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th class="text-end">Precio</th>
                            <th class="text-center">Cantidad</th>
                            <th class="text-end">Subtotal</th>
                            <th class="text-center" style="width:50px;"></th>
                        </tr>
                    </thead>
                    <tbody id="cart-items"></tbody>
                </table>
            </div>
            <div class="cart-total-bar d-flex justify-content-between align-items-center">
                <span class="cart-total-label">Total: <span class="cart-total-amount" id="cart-total">0 €</span></span>
                <a href="#/checkout" class="btn btn-warning">Proceder al pago</a>
            </div>
        </div>
    </div>
</div>
