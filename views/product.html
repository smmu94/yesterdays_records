<div class="container py-4 product-page">
    <div id="product-loading" class="text-center py-5">
        <div class="spinner-border text-warning"></div>
    </div>
    <div id="product-detail" class="d-none">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-4">
                <li class="breadcrumb-item"><a href="#/home">Inicio</a></li>
                <li class="breadcrumb-item active" id="product-breadcrumb" aria-current="page">Producto</li>
            </ol>
        </nav>
        <div class="row g-4 g-md-5 align-items-start">
            <div class="col-12 col-md-6">
                <div class="product-image-wrapper">
                    <img src="" id="product-image" class="img-fluid rounded" alt="">
                </div>
            </div>
            <div class="col-12 col-md-6">
                <p class="text-secondary mb-1" id="product-category"></p>
                <h2 class="caprasimo-regular" id="product-name"></h2>
                <p class="fs-5 text-light" id="product-artist"></p>
                <p class="text-secondary" id="product-description"></p>

                <div class="product-action-zone">
                    <p class="text-warning fs-3 fw-bold mb-3"><span id="product-price"></span> €</p>
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <span class="text-secondary">Cantidad:</span>
                        <div class="quantity-selector">
                            <button type="button" class="btn qty-btn" id="qty-minus">
                                <i class="bi bi-dash"></i>
                            </button>
                            <span class="qty-value" id="qty-value">1</span>
                            <button type="button" class="btn qty-btn" id="qty-plus">
                                <i class="bi bi-plus"></i>
                            </button>
                        </div>
                    </div>
                    <button class="btn btn-warning btn-add-cart w-100" id="btn-add-cart">
                        <i class="bi bi-cart-plus"></i> Agregar al carrito
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div id="product-error" class="d-none text-center py-5">
        <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
        <h3 class="mt-3"></h3>
        <a href="#/home" class="btn btn-warning mt-3">Volver al catálogo</a>
    </div>
</div>
