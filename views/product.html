<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div id="product-loading" class="text-center py-5">
                <div class="spinner-border text-warning"></div>
            </div>
            <div id="product-detail" style="display: none;">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="#/home" class="text-warning">Catálogo</a></li>
                        <li class="breadcrumb-item active" id="product-breadcrumb" aria-current="page">Producto</li>
                    </ol>
                </nav>
                <div class="row">
                    <div class="col-md-6">
                        <img src="" id="product-image" class="img-fluid rounded" alt="">
                    </div>
                    <div class="col-md-6">
                        <p class="text-secondary mb-1" id="product-category"></p>
                        <h2 class="caprasimo-regular" id="product-name"></h2>
                        <p class="fs-5 text-light" id="product-artist"></p>
                        <p class="text-secondary" id="product-description"></p>
                        <p class="text-warning fs-3 fw-bold" id="product-price"></p>
                        <p class="text-secondary" id="product-stock"></p>
                        <button class="btn btn-warning btn-lg" id="btn-add-cart">
                            <i class="bi bi-cart-plus"></i> Agregar al carrito
                        </button>
                    </div>
                </div>
            </div>
            <div id="product-error" style="display:none;" class="text-center py-5">
                <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
                <h3 class="mt-3"></h3>
                <a href="#/home" class="btn btn-warning mt-3">Volver al catálogo</a>
            </div>
        </div>
    </div>
</div>
