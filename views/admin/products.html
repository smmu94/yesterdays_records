<div class="container py-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a href="#/home">Inicio</a></li>
            <li class="breadcrumb-item active">Administrar Productos</li>
        </ol>
    </nav>
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-2 mb-4">
        <h2 class="caprasimo-regular">Productos</h2>
        <a href="#/admin/product/new" class="btn btn-warning"><i class="bi bi-plus-lg"></i> Nuevo Producto</a>
    </div>
    <div class="row g-3 mb-4 admin-filter-row">
        <div class="col-12 col-md-5">
            <input type="text" id="admin-product-search" class="form-control admin-filter-input" placeholder="Buscar por nombre o artista...">
        </div>
        <div class="col-12 col-md-5">
            <select id="admin-product-category" class="form-select admin-filter-select">
                <option value="">Todas las categorías</option>
            </select>
        </div>
        <div class="col-12 col-md-2 d-flex align-items-stretch">
            <button class="btn btn-warning w-100" id="admin-product-clear"><i class="bi bi-arrow-clockwise"></i></button>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table table-dark table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>Nombre</th>
                    <th>Artista</th>
                    <th>Categoria</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="admin-products-body">
                <tr id="products-loading"><td colspan="7" class="text-center py-4"><div class="spinner-border text-warning" role="status"></div></td></tr>
            </tbody>
        </table>
    </div>
    <div id="admin-products-pagination" class="d-flex justify-content-center mt-3"></div>
</div>

<div class="modal fade" id="deleteProductModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Eliminar producto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>¿Estás seguro de que deseas eliminar <strong id="delete-product-name"></strong>?</p>
                <p class="text-secondary mb-0">Esta acción no se puede deshacer.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-danger" id="btn-confirm-delete">Eliminar</button>
            </div>
        </div>
    </div>
</div>
