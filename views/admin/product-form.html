<div class="container py-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a href="#/home">Inicio</a></li>
            <li class="breadcrumb-item"><a href="#/admin/products">Productos</a></li>
            <li class="breadcrumb-item active" id="form-title">Nuevo Producto</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div id="form-loading" class="text-center py-5">
                <div class="spinner-border text-warning" role="status"></div>
            </div>

            <form id="product-form" class="d-none">
                <input type="hidden" id="form-id" value="">

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="form-name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Artista</label>
                    <input type="text" class="form-control" id="form-artist" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripcion</label>
                    <textarea class="form-control" id="form-description" rows="3" required></textarea>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Precio (€)</label>
                        <input type="number" class="form-control" id="form-price" step="0.01" min="0" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Stock</label>
                        <input type="number" class="form-control" id="form-stock" min="0" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Imagen</label>
                        <div class="input-group">
                            <input type="file" class="form-control" id="form-image" accept="image/*" required>
                        </div>
                        <div class="mt-2" id="image-preview-container" class="d-none">
                            <img id="image-preview" src="" alt="Preview" style="max-width:120px; border-radius:8px; border:1px solid rgba(255,193,7,0.3);">
                        </div>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Categoria</label>
                        <select class="form-select" id="form-category" required>
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Genero</label>
                        <select class="form-select" id="form-genre">
                            <option value="">Sin genero</option>
                        </select>
                    </div>
                </div>

                <div id="form-error" class="alert alert-danger d-none"></div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning" id="btn-save">
                        <span class="spinner-border spinner-border-sm d-none" id="save-spinner"></span>
                        <i class="bi bi-check-lg" id="save-icon"></i> Guardar
                    </button>
                    <a href="#/admin/products" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
