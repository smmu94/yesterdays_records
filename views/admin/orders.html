<div class="container py-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a href="#/home">Inicio</a></li>
            <li class="breadcrumb-item active">Pedidos</li>
        </ol>
    </nav>
    <h2 class="caprasimo-regular mb-4">Pedidos</h2>
    <div class="row g-3 mb-4 admin-filter-row">
        <div class="col-12 col-md-4">
            <input type="text" id="admin-order-search" class="form-control admin-filter-input" placeholder="Buscar por nombre o email...">
        </div>
        <div class="col-12 col-md-4">
            <select id="admin-order-status" class="form-select admin-filter-select">
                <option value="">Todos los estados</option>
                <option value="pending">Pendiente</option>
                <option value="paid">Pagado</option>
                <option value="sent">Enviado</option>
            </select>
        </div>
        <div class="col-12 col-md-4 d-flex gap-2 align-items-stretch">
            <button class="btn btn-warning" id="admin-order-clear"><i class="bi bi-arrow-clockwise"></i></button>
            <button class="btn btn-outline-danger" id="admin-order-cancel-stale" title="Cancelar pedidos pendientes +24hs"><i class="bi bi-clock-history"></i></button>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table table-dark table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Cliente</th>
                    <th class="d-none d-sm-table-cell">Email</th>
                    <th>Fecha</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="admin-orders-body">
                <tr id="orders-loading"><td colspan="7" class="text-center py-4"><div class="spinner-border text-warning" role="status"></div></td></tr>
            </tbody>
        </table>
    </div>
    <div id="admin-orders-pagination" class="d-flex justify-content-center mt-3"></div>
</div>

<div class="modal fade" id="adminOrderDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="admin-modal-order-title">Pedido #</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="d-flex align-items-center gap-3 mb-3">
                    <p class="text-secondary mb-0" id="admin-modal-order-info"></p>
                    <select id="admin-modal-order-status" class="form-select form-select-sm admin-filter-select" style="width:auto;">
                        <option value="pending">Pendiente</option>
                        <option value="paid">Pagado</option>
                        <option value="sent">Enviado</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th class="d-none d-sm-table-cell">Artista</th>
                                <th>Precio</th>
                                <th>Cant.</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody id="admin-modal-order-items">
                            <tr><td colspan="5" class="text-center py-3"><div class="spinner-border text-warning" role="status"></div></td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-between mt-3">
                    <strong>Total</strong>
                    <strong id="admin-modal-order-total"></strong>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteOrderModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Eliminar pedido</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>¿Estás seguro de que deseas eliminar el pedido <strong id="delete-order-id"></strong>?</p>
                <p class="text-secondary mb-0">Se restaurará el stock de los productos. Esta acción no se puede deshacer.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-danger" id="btn-confirm-delete-order">Eliminar</button>
            </div>
        </div>
    </div>
</div>
