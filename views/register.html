<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="caprasimo-regular text-center mb-4">Registrarse</h2>
            <div id="register-error" class="alert alert-danger" style="display:none;"></div>
            <div id="register-success" class="alert alert-success" style="display:none;"></div>
            <form id="register-form">
                <div class="mb-3">
                    <label for="register-name" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="register-name" name="name" required>
                </div>
                <div class="mb-3">
                    <label for="register-email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="register-email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="register-password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="register-password" name="password" required>
                </div>
                <button type="submit" class="btn btn-warning">Registrarse</button>
            </form>
            <p class="mt-3">¿Ya tienes cuenta? <a href="#/login">Inicia sesión</a></p>
        </div>
    </div>
</div>
