<div class="container mt-4 checkout">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="#/home" class="text-warning">Catálogo</a></li>
                    <li class="breadcrumb-item"><a href="#/cart" class="text-warning">Carrito</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Checkout</li>
                </ol>
            </nav>
            <div id="checkout-loading" class="text-center py-5">
                <div class="spinner-border text-warning"></div>
            </div>
            <div id="checkout-content" style="display:none;">
                <h2 class="caprasimo-regular mb-4" style="color:#ffc107 !important;">Finalizar compra</h2>
                <div class="row">
                    <div class="col-md-7">
                        <div class="card mb-3">
                            <div class="card-header">
                                <h5 class="mb-0">Resumen del pedido</h5>
                            </div>
                            <div class="card-body" id="checkout-items"></div>
                        </div>
                    </div>
                    <div class="col-md-5">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0">Dirección de envío</h5>
                            </div>
                            <div class="card-body">
                                <div id="saved-addresses"></div>
                                <div id="new-address-form" style="display:none;">
                                    <div class="mb-3">
                                        <label class="form-label">Calle y número</label>
                                        <input type="text" class="form-control" id="checkout-street" placeholder="Calle Real 12, 3ºB">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Ciudad</label>
                                        <select class="form-select" id="checkout-city">
                                            <option value="">Seleccionar ciudad...</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Código postal</label>
                                        <input type="text" class="form-control" id="checkout-cp" placeholder="15003">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card mt-4">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <h4 class="mb-0" style="color:#222;">Total: <span style="color:#222; font-weight:700;" id="checkout-total">0</span> €</h4>
                        <div class="text-end">
                            <div id="checkout-error" class="text-danger mb-2" style="display:none; font-size:0.9rem;"></div>
                            <button class="btn btn-warning" id="btn-pay">
                                <i class="bi bi-credit-card"></i> Pagar con Stripe
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div id="checkout-empty" style="display:none;" class="text-center py-5">
                <i class="bi bi-exclamation-triangle fs-1 text-warning d-block mb-3"></i>
                <h3>Tu carrito está vacío</h3>
                <p class="text-secondary">Agregá productos antes de continuar.</p>
                <a class="btn btn-warning mt-2" id="btn-empty-catalog">Ver catálogo</a>
            </div>
        </div>
    </div>
</div>
