<div class="container py-4 checkout">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a href="#/home">Inicio</a></li>
            <li class="breadcrumb-item"><a href="#/cart">Carrito</a></li>
            <li class="breadcrumb-item active" aria-current="page">Checkout</li>
        </ol>
    </nav>
    <div id="checkout-loading" class="text-center py-5">
        <div class="spinner-border text-warning"></div>
    </div>
    <div id="checkout-content" class="d-none">
        <h2 class="caprasimo-regular mb-4">Finalizar compra</h2>
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="profile-card mb-3">
                    <h5 class="profile-card-title"><i class="bi bi-bag me-2"></i>Resumen del pedido</h5>
                    <div id="checkout-items"></div>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="profile-card">
                    <h5 class="profile-card-title"><i class="bi bi-geo-alt me-2"></i>Dirección de envío</h5>
                    <div id="saved-addresses"></div>
                    <div id="new-address-form" class="d-none mt-3">
                        <div class="mb-3">
                            <label class="form-label">Calle y número</label>
                            <input type="text" class="form-control" id="checkout-street" placeholder="Calle Real 12, 3ºB">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ciudad</label>
                            <select class="form-select" id="checkout-city">
                                <option value="">Seleccionar ciudad...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Código postal</label>
                            <input type="text" class="form-control" id="checkout-cp" placeholder="15003">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="checkout-pay-bar mt-4">
            <h4 class="mb-0">Total: <strong id="checkout-total">0</strong> €</h4>
            <div class="text-end">
                <div id="checkout-error" class="text-danger mb-2 small d-none"></div>
                <button class="btn btn-warning" id="btn-pay">
                    <i class="bi bi-credit-card"></i> Pagar con Stripe
                </button>
            </div>
        </div>
    </div>
    <div id="checkout-empty" class="d-none text-center py-5">
        <i class="bi bi-exclamation-triangle fs-1 text-warning d-block mb-3"></i>
        <h3>Tu carrito está vacío</h3>
        <p class="text-secondary">Agrega productos antes de continuar.</p>
        <a class="btn btn-warning mt-2" id="btn-empty-catalog">Ver catálogo</a>
    </div>
</div>
