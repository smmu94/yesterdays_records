<div class="container py-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a href="#/home">Inicio</a></li>
            <li class="breadcrumb-item active" aria-current="page">Mi Perfil</li>
        </ol>
    </nav>
    <div id="profile-loading" class="text-center py-5">
        <div class="spinner-border text-warning"></div>
    </div>
    <div id="profile-content" style="display:none;">
        <h2 class="caprasimo-regular mb-4">Mi Perfil</h2>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="profile-card">
                    <div class="profile-card-icon">
                        <i class="bi bi-person-circle"></i>
                    </div>
                    <h5 class="profile-card-title">Datos personales</h5>
                    <div class="profile-info">
                        <span class="profile-label">Nombre</span>
                        <span class="profile-value" id="profile-name"></span>
                    </div>
                    <div class="profile-info">
                        <span class="profile-label">Email</span>
                        <span class="profile-value" id="profile-email"></span>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="profile-card">
                    <h5 class="profile-card-title">Mis pedidos</h5>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Fecha</th>
                                    <th>Total</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>
                            <tbody id="profile-orders">
                                <tr id="orders-loading"><td colspan="4" class="text-center py-4"><div class="spinner-border text-warning" role="status"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="profile-orders-pagination" class="d-flex justify-content-center mt-3"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="profile-empty" style="display:none;" class="text-center py-5">
        <i class="bi bi-receipt fs-1 text-secondary d-block mb-3"></i>
        <h3>No tienes pedidos aún</h3>
        <p class="text-secondary">Explora nuestro catálogo y haz tu primera compra.</p>
        <a href="#/home" class="btn btn-warning mt-2">Ver catálogo</a>
    </div>
</div>

<div class="modal fade" id="orderDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-order-title">Pedido #</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="text-secondary mb-3" id="modal-order-date"></p>
                <table class="table table-dark table-hover align-middle mb-3">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Artista</th>
                            <th>Precio</th>
                            <th>Cantidad</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody id="modal-order-items"></tbody>
                </table>
                <hr>
                <div class="d-flex justify-content-between">
                    <strong>Total</strong>
                    <strong id="modal-order-total"></strong>
            </div>
        </div>
    </div>
</div>
